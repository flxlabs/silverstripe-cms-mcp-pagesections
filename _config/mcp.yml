---
Name: cmsmcp-pagesections-config
After:
  - "cmsmcp-config"
---
SilverStripe\Core\Injector\Injector:
  FLXLabs\CmsMcp\MCP\ToolRegistry:
    properties:
      Tools:
        - '%$FLXLabs\CmsMcpPagesections\Tools\GetPageElementsTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\CreatePageElementTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\AddPageElementToSectionTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\CopyPageElementToSectionTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\CheckPageElementAllowedTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\RemovePageElementFromSectionTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\AddPageElementAsChildTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\RemovePageElementFromParentTool'
        - '%$FLXLabs\CmsMcpPagesections\Tools\SetPageElementOrderTool'

FLXLabs\PageSections\PageSection:
  extensions:
    - FLXLabs\CmsMcp\Extensions\MCPExposableExtension

FLXLabs\PageSections\PageElement:
  extensions:
    - FLXLabs\CmsMcp\Extensions\MCPExposableExtension
